<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Match - Find your next meal</title>
    <meta
      name="description"
      content="A mobile-first meal discovery prototype for busy college students."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div class="backdrop backdrop-a"></div>
      <div class="backdrop backdrop-b"></div>

      <header class="topbar">
        <div class="brand-lockup" aria-label="Meal Match">
          <div class="brand-mark">MM</div>
          <div>
            <p class="eyebrow">Meal Match</p>
          </div>
        </div>
      </header>

      <main class="screen-stack" aria-live="polite">
        <section
          class="screen active"
          id="home-screen"
          data-screen="home"
          aria-labelledby="home-title"
        >
          <div class="landing-art landing-art-top" aria-hidden="true">
            <img
              class="landing-art-item art-1"
              src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
              data-art-for="quesadilla"
              alt=""
            />
            <img
              class="landing-art-item art-2"
              src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
              data-art-for="teriyaki"
              alt=""
            />
          </div>

          <div class="hero-card">
            <h1 id="home-title">Find meals worth eating.</h1>
            <div class="hero-actions">
              <button class="primary-button" type="button" data-nav="discover">
                Explore Meals
              </button>
              <button class="secondary-button" type="button" data-nav="saved">
                Saved Meals
              </button>
            </div>
          </div>
          <div class="landing-art landing-art-bottom" aria-hidden="true">
            <img
              class="landing-art-item art-3"
              src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
              data-art-for="grilled-cheese"
              alt=""
            />
            <img
              class="landing-art-item art-4"
              src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
              data-art-for="pesto"
              alt=""
            />
          </div>
        </section>

        <section
          class="screen"
          id="discover-screen"
          data-screen="discover"
          aria-label="Meal discovery"
        >
          <div class="familiarity-control">
            <p class="remix-context" id="remix-context">Based on your usual meals</p>
            <h2><label for="familiarity-dial">How different do you want to go?</label></h2>
            <input id="familiarity-dial" type="range" min="0" max="3" step="1" value="1"
              aria-label="How different do you want to go?" aria-valuetext="A Little Different" />
            <div class="dial-endpoints" aria-hidden="true"><span>Familiar</span><span>Different</span></div>
            <output id="familiarity-label" for="familiarity-dial">A Little Different</output>
          </div>
          <div class="deck-stage">
            <div
              class="card-stack"
              id="card-stack"
              aria-label="Meal discovery cards"
            ></div>
          </div>

          <div class="swipe-controls" aria-label="Meal actions">
            <button
              class="swipe-control reject-control"
              type="button"
              id="skip-button"
              aria-label="Skip meal"
            >
              <span class="swipe-control-icons" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M4 12h11M10 6l-6 6 6 6" />
                </svg>
                <svg viewBox="0 0 24 24"><path d="M7 7 17 17M17 7 7 17" /></svg>
              </span>
            </button>
            <button
              class="swipe-control save-control"
              type="button"
              id="save-button"
              aria-label="Save meal"
            >
              <span class="swipe-control-icons" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M20 12h-11M14 6l6 6-6 6" />
                </svg>
                <svg viewBox="0 0 24 24">
                  <path
                    d="M12 20s-7-4.4-9.2-8.4C1 8 2.9 4.5 6.5 4.2c2.1-.2 3.9 1 5 2.4 1.1-1.4 2.9-2.6 5-2.4 3.6.3 5.5 3.8 3.7 7.4C19 15.6 12 20 12 20Z"
                  />
                </svg>
              </span>
            </button>
          </div>
        </section>

        <section
          class="screen"
          id="saved-screen"
          data-screen="saved"
          aria-labelledby="saved-title"
        >
          <div class="saved-header">
            <h2 id="saved-title">Your saved meals</h2>
          </div>

          <div
            class="filter-row"
            role="group"
            aria-label="Saved meal filters"
          >
            <button class="filter-chip active" type="button" data-filter="all" aria-pressed="true">
              All
            </button>
            <button class="filter-chip" type="button" data-filter="quick" aria-pressed="false">
              Quick
            </button>
            <button class="filter-chip" type="button" data-filter="cheap" aria-pressed="false">
              Cheap
            </button>
          </div>

          <div class="saved-results" id="saved-results"></div>

          <div class="empty-state hidden" id="saved-empty">
            <div class="empty-visual">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <defs>
                  <linearGradient id="emptyGrad" x1="0" x2="1" y1="0" y2="1">
                    <stop offset="0%" stop-color="#f4b36a" />
                    <stop offset="100%" stop-color="#8aa3b7" />
                  </linearGradient>
                </defs>
                <rect
                  x="26"
                  y="18"
                  width="68"
                  height="84"
                  rx="18"
                  fill="url(#emptyGrad)"
                  opacity="0.18"
                />
                <path
                  d="M37 45c0-12 10-22 23-22s23 10 23 22v31c0 4-3 7-7 7H44c-4 0-7-3-7-7V45Z"
                  fill="#ffffff"
                  stroke="#d6c7b3"
                  stroke-width="2"
                />
                <path
                  d="M47 44h26"
                  stroke="#8a684f"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <path
                  d="M47 54h18"
                  stroke="#8a684f"
                  stroke-width="3"
                  stroke-linecap="round"
                  opacity="0.85"
                />
                <circle cx="84" cy="84" r="13" fill="#f4b36a" opacity="0.24" />
              </svg>
            </div>
            <h3>No saved meals yet.</h3>
            <p>Save a few ideas and they will show up here.</p>
          </div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button
          class="nav-item active"
          type="button"
          data-nav="home"
          aria-current="page"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11.2 12 4l8 7.2V20H4v-8.8Z" />
          </svg>
          <span>Home</span>
        </button>
        <button class="nav-item" type="button" data-nav="discover">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-6.5-3.5-4.2 2.3 2.3 4.2 4.2-2.3-2.3-4.2Z"
            />
          </svg>
          <span>Discover</span>
        </button>
        <button class="nav-item" type="button" data-nav="saved">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 4.5h10a1 1 0 0 1 1 1V21l-6-3.5-6 3.5V5.5a1 1 0 0 1 1-1Z"
            />
          </svg>
          <span>Saved</span>
          <span class="nav-badge" id="saved-badge">0</span>
        </button>
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite">
        <span id="toast-message"></span>
        <button
          class="toast-action"
          type="button"
          id="toast-action"
        >
          Undo
        </button>
      </div>
      <dialog id="remove-dialog" class="remove-dialog" aria-labelledby="remove-title" aria-describedby="remove-description">
        <h2 id="remove-title">Remove saved meal?</h2>
        <p id="remove-description"></p>
        <p id="remove-error" class="hidden" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="secondary-button" id="cancel-remove" autofocus>Cancel</button>
          <button type="button" class="primary-button destructive-button" id="confirm-remove">Remove</button>
        </div>
      </dialog>
    </div>
  </body>
</html>
